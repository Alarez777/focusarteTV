name: FocusarteTV

# El .xcodeproj no se versiona: se genera con
#   brew install xcodegen && xcodegen generate
options:
  bundleIdPrefix: com.focusartetv
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.32"
    CURRENT_PROJECT_VERSION: "32"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FocusarteCore:
    path: FocusarteCore

targets:
  FocusarteTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - package: FocusarteCore
    sources:
      - path: FocusarteTV/Sources
      - path: FocusarteTV/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusartetv.FocusarteTV
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
    info:
      path: FocusarteTV/Info.plist
      properties:
        CFBundleDisplayName: Focusarte
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        # SwiftUI en tvOS necesita una escena declarada; sin esto la app
        # arranca y muere antes de mostrar la primera vista.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAccentColorName: AccentColor
        CFBundleIcons:
          CFBundlePrimaryIcon: App Icon
        TVTopShelfImage:
          TVTopShelfPrimaryImage: Top Shelf Image
          TVTopShelfPrimaryImageWide: Top Shelf Image Wide
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
